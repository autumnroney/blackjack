<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackjack</title>
  <meta name="description" content="Play blackjack in your browser, dealt from a six-deck shoe by the Deck of Cards API." />
  <link rel="icon" href="https://deckofcardsapi.com/static/img/AS.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/game.js"></script>
  <script type="module" src="js/auth.js"></script>
</head>
<body>
  <main class="table">
    <header class="topbar">
      <h1>Blackjack</h1>
      <div class="stats">
        <span>Bankroll <strong id="bankroll">$0</strong></span>
        <span>Shoe <strong id="shoe">—</strong></span>
      </div>
      <div class="auth">
        <button class="google-btn" id="auth-signed-out" type="button">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span id="google-signin-label">Sign in with Google</span>
        </button>
        <div class="user" id="auth-signed-in" hidden>
          <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer" hidden />
          <span class="avatar avatar-fallback" id="avatar-fallback" aria-hidden="true"></span>
          <span class="user-name" id="user-name"></span>
          <button class="link-btn" id="signout" type="button">Sign out</button>
        </div>
      </div>
    </header>

    <p class="greeting" id="greeting" hidden></p>
    <p class="auth-error" id="auth-error" role="alert" hidden></p>

    <section class="area dealer" aria-label="Dealer">
      <h2>Dealer <span class="total" id="dealer-total"></span></h2>
      <div class="cards" id="dealer-cards"></div>
    </section>

    <p class="message" id="message" role="status" aria-live="polite">Place your bet to begin.</p>

    <section class="area player" aria-label="Your hands">
      <div class="hands" id="player-hands"></div>
    </section>

    <section class="controls">
      <div class="betting" id="betting">
        <div class="bet-display">Bet <strong id="bet">$0</strong></div>
        <div class="chips">
          <button class="chip c5" data-chip="5">5</button>
          <button class="chip c25" data-chip="25">25</button>
          <button class="chip c100" data-chip="100">100</button>
          <button class="chip c500" data-chip="500">500</button>
        </div>
        <div class="row">
          <button class="btn ghost" id="clear-bet">Clear</button>
          <button class="btn primary" id="deal">Deal</button>
        </div>
      </div>

      <div class="actions" id="actions" hidden>
        <button class="btn" id="hit">Hit</button>
        <button class="btn" id="stand">Stand</button>
        <button class="btn" id="double">Double</button>
        <button class="btn" id="split">Split</button>
      </div>

      <div class="row" id="broke" hidden>
        <button class="btn primary" id="reset">Reset bankroll to $1,000</button>
      </div>
    </section>

    <footer class="footer">
      Six decks · Dealer stands on all 17s · Blackjack pays 3:2 · Cards by
      <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a>
    </footer>
  </main>
</body>
</html>
